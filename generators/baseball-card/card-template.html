<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baseball Card</title>
<style>
  @page { size: 11in 8.5in; margin: 0; }
  :root {
    --navy: #1A2B4A;
    --accent: #1F8A8A;
    --ink: #1d2433;
    --muted: #5b6475;
    --line: #dfe4ec;
    --tile: #f3f5f9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 11in; height: 8.5in; }
  body {
    font-family: Arial, "Liberation Sans", Helvetica, sans-serif;
    color: var(--ink);
    background: #ffffff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .card { width: 11in; height: 8.5in; padding: 0.4in 0.45in 0.3in; display: flex; flex-direction: column; gap: 0.2in; overflow: hidden; }

  .top { display: flex; align-items: center; gap: 0.3in; background: var(--navy); color: #fff; border-radius: 14px; padding: 0.22in 0.32in; }
  .photo { width: 1.25in; height: 1.25in; border-radius: 50%; flex: none; border: 3px solid #fff; overflow: hidden; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; letter-spacing: 1px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .name { font-size: 34px; font-weight: 700; line-height: 1.1; }
  .headline { font-size: 16px; font-weight: 700; margin-top: 6px; color: #cfe8e8; }
  .positioning { font-size: 14px; margin-top: 6px; opacity: 0.92; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.16in; }
  .stat { background: var(--tile); border-radius: 12px; padding: 0.14in 0.16in; border-top: 5px solid var(--accent); }
  .stat .v { font-size: 30px; font-weight: 700; color: var(--navy); line-height: 1.1; }
  .stat .l { font-size: 12.5px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.6px; }

  .proof { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 0.14in; min-height: 0; }
  .pc { border: 1px solid var(--line); border-radius: 12px; padding: 0.13in 0.15in; display: flex; flex-direction: column; gap: 6px; }
  .pc .t { font-size: 13.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.6px; }
  .pc .r { font-size: 17px; line-height: 1.4; flex: 1; }
  .pc .w { font-size: 12px; color: var(--muted); }

  .foot { display: flex; justify-content: center; gap: 0.3in; font-size: 13px; color: var(--navy); border-top: 2px solid var(--navy); padding-top: 0.1in; }
  .foot span + span::before { content: "|"; color: var(--accent); margin-right: 0.3in; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
  const DATA = /*DATA*/null;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const initials = DATA.name.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
  document.getElementById("card").innerHTML = `
    <section class="top">
      <div class="photo">${DATA.photo ? `<img src="${esc(DATA.photo)}" alt="">` : esc(initials)}</div>
      <div>
        <div class="name">${esc(DATA.name)}</div>
        <div class="headline">${esc(DATA.headline)}</div>
        <div class="positioning">${esc(DATA.positioning)}</div>
      </div>
    </section>
    <section class="stats">
      ${DATA.stats.map((s) => `<div class="stat"><div class="v">${esc(s.value)}</div><div class="l">${esc(s.label)}</div></div>`).join("")}
    </section>
    <section class="proof">
      ${DATA.proof.map((p) => `<div class="pc"><div class="t">${esc(p.title)}</div><div class="r">${esc(p.result)}</div><div class="w">${esc(p.where)}</div></div>`).join("")}
    </section>
    <footer class="foot">${DATA.contact.map((c) => `<span>${esc(c)}</span>`).join("")}</footer>`;
</script>
</body>
</html>
