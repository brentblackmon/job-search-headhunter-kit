<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baseball Card</title>
<style>
  @page { size: 11in 8.5in; margin: 0; }
  :root {
    --navy: #1A2B4A;
    --accent: #1F8A8A;
    --ink: #1d2433;
    --muted: #5b6475;
    --line: #dfe4ec;
    --tile: #f3f5f9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 11in; height: 8.5in; }
  body {
    font-family: Arial, "Liberation Sans", Helvetica, sans-serif;
    color: var(--ink);
    background: #ffffff;
    -webkit-print-color-adjust: exact;
  }
  .card { width: 11in; height: 8.5in; padding: 0.4in 0.45in 0.3in; display: flex; flex-direction: column; gap: 0.2in; overflow: hidden; }

  .top { display: flex; align-items: center; gap: 0.3in; background: var(--navy); color: #fff; border-radius: 14px; padding: 0.22in 0.32in; }
  .photo { width: 1.25in; height: 1.25in; border-radius: 50%; flex: none; border: 3px solid #fff; overflow: hidden; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; letter-spacing: 1px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .name { font-size: 34px; font-weight: 700; line-height: 1.1; }
  .headline { font-size: 16px; font-weight: 700; margin-top: 6px; color: #cfe8e8; }
  .positioning { font-size: 14px; margin-top: 6px; opacity: 0.92; }

  .stats { display: flex; gap: 0.16in; height: 0.9in; }
  .stat { flex: 1 1 0; min-width: 0; background: var(--tile); border-radius: 12px; padding: 0.14in 0.16in; border-top: 5px solid var(--accent); }
  .stat .v { font-size: 30px; font-weight: 700; color: var(--navy); line-height: 1.1; }
  .stat .l { font-size: 12.5px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.6px; }

  /* Flex rows with fixed heights (no CSS grid) so Chromium and WeasyPrint lay the page out the same way. */
  .top, .stats, .foot { flex: none; }
  .proof { flex: none; height: 4.25in; display: flex; flex-direction: column; gap: 0.14in; }
  .prow { display: flex; gap: 0.14in; height: 2.055in; }
  .pc { flex: 1 1 0; min-width: 0; height: 2.055in; overflow: hidden; position: relative; border: 1px solid var(--line); border-radius: 12px; padding: 0.13in 0.15in 0.5in; }
  .pc .t { font-size: 13.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
  .pc .r { font-size: 16px; line-height: 1.35; }
  /* Company and years pinned to the bottom; the 0.5in bottom padding above keeps result text clear of it. */
  .pc .w { position: absolute; left: 0.15in; right: 0.15in; bottom: 0.12in; font-size: 12px; line-height: 1.25; color: var(--muted); }

  .foot { display: flex; justify-content: center; gap: 0.3in; font-size: 13px; color: var(--navy); border-top: 2px solid var(--navy); padding-top: 0.1in; }
  .foot span + span::before { content: "|"; color: var(--accent); margin-right: 0.3in; }
</style>
</head>
<body>
<!-- render-card.js fills this div with the card markup (see buildCard in render-card.js).
     The page has no script, so any HTML-to-PDF tool can print the filled file. -->
<div class="card" id="card"><!--CARD--></div>
</body>
</html>
