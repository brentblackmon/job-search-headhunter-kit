<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baseball Card</title>
<style>
  /* Locked layout. Landscape US Letter, one page. Sizes in px at 96 per inch.
     Flex rows with fixed widths (no CSS grid) so Chromium and WeasyPrint print it the same way. */
  @page { size: 11in 8.5in; margin: 0; }
  :root {
    --ink: #14171c;      /* header band, footer band, tags */
    --accent: #d9744f;   /* eyebrows, stat bars, photo frame, headline accent */
    --paper: #faf9f6;    /* page background */
    --tile: #eeece5;     /* stat tiles */
    --line: #e2e0d8;     /* card borders */
    --text: #1a1a1a;
    --body: #333333;
    --label: #555555;
    --muted: #888888;
    --intro: #cfd2d8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 11in; height: 8.5in; }
  body {
    font-family: Arial, "Liberation Sans", Helvetica, sans-serif;
    color: var(--text);
    background: var(--paper);
    -webkit-print-color-adjust: exact;
  }
  .card { width: 11in; height: 8.5in; position: relative; overflow: hidden; background: var(--paper); }

  /* Header band */
  .top { background: var(--ink); height: 200px; padding: 26px 48px 0; position: relative; }
  .top .text { width: 745px; }
  .name { color: #fff; font-size: 24px; font-weight: 700; letter-spacing: 0.42em; line-height: 1.15; text-transform: uppercase; }
  .eyebrow { color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 0.42em; line-height: 1.3; text-transform: uppercase; }
  .top .eyebrow { margin-top: 10px; }
  .headline { color: #fff; font-size: 21px; font-weight: 700; line-height: 1.25; margin-top: 12px; }
  .headline .hl { color: var(--accent); }
  .intro { color: var(--intro); font-size: 12.5px; line-height: 1.5; margin-top: 10px; }
  .photo { position: absolute; top: 26px; right: 48px; width: 108px; height: 136px; border: 3px solid var(--accent); background: var(--accent); overflow: hidden; }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .photo .initials { color: #fff; font-size: 34px; font-weight: 700; text-align: center; line-height: 130px; letter-spacing: 2px; }

  /* Stat tiles */
  .stats { display: flex; padding: 19px 48px 0; height: 95px; }
  .stat { width: 218px; height: 76px; margin-right: 29px; background: var(--tile); border-top: 3px solid var(--accent); padding: 13px 15px 0; }
  .stat:last-child { margin-right: 0; }
  .stat .v { font-size: 24px; font-weight: 700; color: var(--ink); line-height: 1.1; white-space: nowrap; }
  .stat .l { font-size: 9px; font-weight: 700; color: var(--label); text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.3; margin-top: 5px; }

  /* Proof sections */
  .section { padding: 0 48px; margin-top: 30px; }
  .section + .section { margin-top: 22px; }
  .section .title { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; margin-top: 3px; }
  .row { display: flex; margin-top: 14px; }
  .pc { width: 228px; height: 150px; margin-right: 16px; background: #fff; border: 1px solid var(--line); padding: 16px 12px 0; overflow: hidden; }
  .pc:last-child { margin-right: 0; }
  .tag { display: inline-block; background: var(--ink); color: #fff; font-size: 7.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 6px 3px; line-height: 1.1; }
  .pc .t { font-size: 11px; font-weight: 700; color: var(--text); margin-top: 9px; line-height: 1.25; }
  .pc .p { font-size: 9px; font-style: italic; color: var(--muted); margin-top: 5px; line-height: 1.3; }
  .pc .b { font-size: 9.4px; color: var(--body); margin-top: 6px; line-height: 1.55; }

  /* Footer band */
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: var(--ink); padding: 0 48px; display: flex; align-items: center; justify-content: space-between; }
  .foot .tagline { color: #fff; font-size: 10.5px; font-weight: 700; }
  .foot .tagline .hl { color: var(--accent); }
  .foot .contact { color: #fff; font-size: 10px; }
</style>
</head>
<body>
<!-- render-card.js fills this div with the card markup (see buildCard in render-card.js).
     The page has no script, so any HTML-to-PDF tool can print the filled file. -->
<div class="card" id="card"><!--CARD--></div>
</body>
</html>
